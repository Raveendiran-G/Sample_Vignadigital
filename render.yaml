# Render Blueprint: New + > Blueprint, point at this repo.
# A persistent disk (for uploaded photos) requires a paid instance type. Data lives in MongoDB Atlas.
services:
  - type: web
    name: digital-menu
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false   # your Atlas connection string; allow Render's IPs (or 0.0.0.0/0) in Atlas Network Access
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # BASE_URL: set to https://menu.vignadigital.com once the domain is attached (QR codes use it).
      # Until then the app falls back to Render's RENDER_EXTERNAL_URL.
