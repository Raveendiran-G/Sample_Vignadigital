<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#d9480f" id="themeMeta">

    <title>Menu</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        /* =========================================
   FLOATING CART BAR
========================================= */

        body.menu-page #cartBar.cart-bar {
            position: fixed !important;
            left: 50% !important;
            right: auto !important;
            bottom: max(12px, env(safe-area-inset-bottom)) !important;
            top: auto !important;
            transform: translateX(-50%) !important;
            z-index: 10000 !important;
            width: min(1000px, calc(100% - 24px)) !important;
            min-height: 58px;
            margin: 0 !important;
            padding: 9px 10px 9px 18px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 14px !important;
            border: 0;
            border-radius: 13px;
            box-sizing: border-box;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .24);
            text-align: left !important;
            cursor: pointer;
        }

        body.menu-page #cartBar.cart-bar>span {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
        }

        body.menu-page #cartBar.cart-bar>strong {
            flex: 0 0 auto;
            margin-left: auto;
            text-align: center;
        }

        body.menu-page #cartBar[hidden] {
            display: none !important;
        }

        /* =========================================
   CHECKOUT POPUP
========================================= */

        body.menu-page .checkout-overlay {
            position: fixed !important;
            inset: 0 !important;
            z-index: 20000 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow-y: auto !important;
            background: rgba(0, 0, 0, .55) !important;
            padding: 14px !important;
            box-sizing: border-box !important;
        }

        body.menu-page .checkout-panel {
            position: relative !important;
            display: block !important;
            width: min(520px, 100%) !important;
            margin: auto !important;
            overflow-y: auto !important;
            box-sizing: border-box !important;
        }

        body.menu-page .checkout-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #e7d8cb;
        }

        body.menu-page .checkout-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.menu-page .checkout-totals {
            margin: 16px 0;
        }

        body.menu-page .checkout-totals>div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 0;
        }

        body.menu-page .checkout-total {
            border-top: 1px dashed #bba18d;
            margin-top: 8px;
            padding-top: 10px !important;
            font-size: 1.1rem;
            font-weight: 800;
        }

        body.menu-page #placeOrderForm {
            display: grid;
            gap: 12px;
        }

        body.menu-page #placeOrderForm label {
            display: grid;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        body.menu-page .checkout-close {
            position: absolute;
            top: 10px;
            right: 10px;
            min-width: 36px;
            min-height: 36px;
            cursor: pointer;
        }

        body.menu-page .checkout-panel h2 {
            padding-right: 44px;
        }

        body.menu-page .checkout-panel .place-order {
            min-height: 44px;
            cursor: pointer;
        }

        /* =========================================
   CHECKOUT DESIGN
========================================= */

        body.menu-page .checkout-panel {
            background: #fffaf1 !important;
            color: #4d3429 !important;
            border: 1px solid #e7d4c2;
            border-radius: 20px !important;
            max-height: min(92dvh, 900px) !important;
            padding: 24px 20px calc(20px + env(safe-area-inset-bottom)) !important;
        }

        body.menu-page .checkout-panel h2,
        body.menu-page .checkout-panel .checkout-total {
            color: #603123 !important;
        }

        body.menu-page .checkout-line {
            border-bottom-color: #e7d8cb !important;
        }

        body.menu-page .checkout-qty button {
            background: #f8e8d8 !important;
            color: #603123 !important;
            border: 1px solid #ead3c0;
            border-radius: 8px;
            min-width: 32px;
            min-height: 32px;
        }

        body.menu-page .checkout-panel input,
        body.menu-page .checkout-panel select,
        body.menu-page .checkout-panel textarea {
            background: #fffdf9 !important;
            color: #3d2a22 !important;
            border: 1px solid #d9c4b4 !important;
            border-radius: 10px !important;
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            padding: 12px !important;
        }

        body.menu-page .checkout-panel input:focus,
        body.menu-page .checkout-panel select:focus,
        body.menu-page .checkout-panel textarea:focus {
            outline: 2px solid #f58220;
            outline-offset: 1px;
        }

        body.menu-page .checkout-panel .place-order {
            background: #f58220 !important;
            color: #fff !important;
            border: 0;
            border-radius: 10px;
        }

        body.menu-page .checkout-panel .place-order:hover {
            background: #df6b12 !important;
        }

        body.menu-page .checkout-close {
            background: #f4e7dc !important;
            color: #603123 !important;
            border: 0;
            border-radius: 9px;
        }

        /* =========================================
   RECEIPT ANIMATION
========================================= */

        body.menu-page .receipt-stage {
            position: relative;
            padding-top: 20px;
        }

        body.menu-page .animated-receipt {
            background: #fffdf7;
            color: #493328;
            width: min(100%, 340px);
            box-sizing: border-box;
            margin: 0 auto;
            padding: 22px 18px;
            font: 12px/1.5 monospace;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
            animation: receiptDrop .8s ease both;
        }

        body.menu-page .animated-receipt p {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        body.menu-page .animated-receipt table {
            width: 100%;
            border-collapse: collapse;
        }

        body.menu-page .animated-receipt td:last-child {
            text-align: right;
            white-space: nowrap;
        }

        body.menu-page .receipt-brand,
        body.menu-page .receipt-sub,
        body.menu-page .animated-receipt h3,
        body.menu-page .receipt-thanks {
            text-align: center;
        }

        body.menu-page .receipt-printer {
            text-align: center;
            background: #292929;
            color: #e9b777;
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            letter-spacing: 2px;
        }

        body.menu-page .receipt-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        body.menu-page .receipt-actions>button {
            flex: 1;
            min-height: 42px;
        }

        body.menu-page .order-status {
            text-align: center;
            margin-top: 12px;
        }

        @keyframes receiptDrop {
            from {
                opacity: 0;
                transform: translateY(-24px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================================
   ANIMATED THERMAL RECEIPT
========================================= */

        body.menu-page .checkout-panel.receipt-mode {
            background: transparent !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 !important;
            overflow: visible !important;
            max-height: none !important;
            width: min(100%, 410px) !important;
        }

        body.menu-page .receipt-animation-wrap {
            width: 100%;
            min-height: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            padding: 8px 0 18px;
        }

        body.menu-page .receipt-printer-stage {
            width: min(100%, 360px);
            text-align: center;
            animation: printerEnter .55s ease both;
        }

        body.menu-page .printer-brand {
            color: #fff4e8;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px #0008;
        }

        body.menu-page .receipt-printing-paper {
            width: 78%;
            min-height: 210px;
            margin: 0 auto -3px;
            padding: 18px 14px 25px;
            background: #fffdf7;
            color: #493328;
            box-shadow: none;
            position: relative;
            padding-bottom: 12px;
            animation: paperFeed 1.8s ease-in-out both;
        }

        body.menu-page .receipt-printing-paper::after,
        body.menu-page .receipt-final-paper::after {
            content: "";
            display: block;
            height: 12px;
            margin: 8px -18px -12px;
            background: inherit;
            clip-path: polygon(0 0,
                    7.5% 100%,
                    15% 0,
                    22.5% 100%,
                    30% 0,
                    37.5% 100%,
                    45% 0,
                    52.5% 100%,
                    60% 0,
                    67.5% 100%,
                    75% 0,
                    82.5% 100%,
                    90% 0,
                    97.5% 100%,
                    100% 0);
        }

        body.menu-page .printing-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        body.menu-page .receipt-printing-paper h2 {
            margin: 6px 0;
            font-size: 17px;
            color: #603123;
        }

        body.menu-page .receipt-printing-paper p {
            font-size: 10px;
            letter-spacing: 1px;
        }

        body.menu-page .printer-icon {
            font-size: 30px;
            margin-top: 12px;
        }

        body.menu-page .printer-machine {
            position: relative;
            z-index: 1;
            background: linear-gradient(#555, #222);
            color: #f5d6b7;
            padding: 18px 10px;
            border-radius: 12px 12px 18px 18px;
            box-shadow: 0 10px 20px #0003;
            font-size: 11px;
            letter-spacing: 1px;
        }

        body.menu-page .printer-machine span {
            display: block;
            height: 8px;
            background: #111;
            border-radius: 8px;
            margin: -10px 12px 12px;
        }

        body.menu-page .receipt-hidden {
            display: none !important;
        }

        body.menu-page .receipt-final-paper {
            width: min(100%, 360px);
            max-height: calc(92dvh - 28px);
            overflow: auto;
            margin: 0 auto;
            padding: 20px 18px 28px;
            box-sizing: border-box;
            background: #fffdf7;
            color: #493328;
            box-shadow: none;
            font: 12px/1.5 monospace;
            position: relative;
            padding-bottom: 12px;
            animation: receiptUnroll .8s cubic-bezier(.2, .8, .2, 1) both;
        }

        body.menu-page .receipt-head,
        body.menu-page .receipt-foot {
            text-align: center;
        }

        body.menu-page .receipt-icon {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        body.menu-page .receipt-head h2 {
            margin: 5px 0;
            color: #603123;
        }

        body.menu-page .receipt-label {
            border-top: 1px dashed #9c8b7d;
            margin-top: 10px;
            padding-top: 8px;
            font-weight: 800;
        }

        body.menu-page .receipt-meta {
            font-size: 11px;
            margin: 10px 0;
        }

        body.menu-page .meta-line {
            display: grid;
            grid-template-columns: 76px 8px minmax(0, 1fr);
            gap: 4px;
            overflow-wrap: anywhere;
        }

        body.menu-page .receipt-items {
            border-top: 1px dashed #9c8b7d;
            border-bottom: 1px dashed #9c8b7d;
            margin: 10px 0;
            padding: 8px 0;
        }

        body.menu-page .receipt-table-head,
        body.menu-page .receipt-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 25px 48px 52px;
            gap: 3px;
            font-size: 9px;
            padding: 5px 0;
        }

        body.menu-page .receipt-table-head {
            font-weight: 800;
            border-bottom: 1px solid #ddd;
        }

        body.menu-page .receipt-table-head span:not(:first-child),
        body.menu-page .receipt-row span:not(:first-child),
        body.menu-page .receipt-row strong {
            text-align: right;
        }

        body.menu-page .receipt-row span:first-child {
            overflow-wrap: anywhere;
        }

        body.menu-page .receipt-summary-line,
        body.menu-page .receipt-total {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 5px 0;
        }

        body.menu-page .receipt-total {
            border-top: 1px dashed #493328;
            border-bottom: 1px dashed #493328;
            margin-top: 5px;
            padding: 9px 0;
            font-weight: 900;
            font-size: 14px;
        }

        body.menu-page .receipt-foot {
            padding-top: 12px;
            line-height: 1.8;
        }

        body.menu-page .leaf-divider,
        body.menu-page .receipt-hearts {
            color: #8a4b2c;
            margin: 5px 0;
        }

        body.menu-page .receipt-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        body.menu-page .receipt-actions button {
            flex: 1;
            min-height: 42px;
            border: 0;
            border-radius: 9px;
            background: #f58220;
            color: white;
            cursor: pointer;
        }

        body.menu-page .receipt-actions .receipt-secondary {
            background: #f4e7dc;
            color: #603123;
        }

        body.menu-page .order-status {
            text-align: center;
            margin-top: 10px;
        }

        /* =========================================
   RECEIPT ANIMATION KEYFRAMES
========================================= */

        @keyframes printerEnter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes paperFeed {
            0% {
                transform: translateY(-90px);
                opacity: 0;
            }

            35% {
                opacity: 1;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes receiptUnroll {
            from {
                opacity: 0;
                transform: translateY(-35px) scaleY(.15);
                transform-origin: top;
            }

            to {
                opacity: 1;
                transform: translateY(0) scaleY(1);
            }
        }

        /* =========================================
   ORIGINAL UPI QR SECTION
========================================= */

        .receipt-upi {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
            padding: 14px 10px;
            margin: 12px 0;
            border-bottom: 1px dashed #999;
            background: #fff;
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
        }

        .receipt-upi-image {
            width: 140px;
            height: 140px;
            max-width: 100%;
            max-height: 140px;
            object-fit: contain;
            display: block;
            margin: 8px auto;
            background: #fff;
        }

        .receipt-upi-id {
            font-size: 12px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .receipt-qr-missing {
            font-size: 12px;
            color: #777;
        }

        .receipt-upi.qr-error::after {
            content: "QR image could not be loaded";
            font-size: 11px;
            color: #d33;
        }

        .receipt-upi small {
            display: block !important;
            margin-top: 6px !important;
            font-size: 10px !important;
            color: #666 !important;
        }

        @media print {
            .receipt-upi {
                display: flex !important;
                width: 100% !important;
                page-break-inside: avoid !important;
            }

            .receipt-upi-image {
                display: block !important;
                width: 120px !important;
                height: 120px !important;
            }
        }

        /* =========================================
   CART BAR APPEARANCE
========================================= */

        body.menu-page #cartBar.cart-bar {
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #493328 !important;
            border: 1px solid #e5d5c6 !important;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .12) !important;
        }

        body.menu-page #cartBar.cart-bar strong {
            background: transparent !important;
            color: #493328 !important;
            border: none !important;
        }

        body.menu-page #cartBar.cart-bar:hover {
            background: #f5f5f5 !important;
        }

        /* =========================================
   MENU CARD ACTION BUTTONS
========================================= */

        body.menu-page .menu-card-actions {
            display: flex;
            width: 100%;
            gap: 7px;
            margin-top: 10px;
        }

        body.menu-page .menu-card-actions button {
            flex: 1;
            min-width: 0;
            height: 38px;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease;
        }

        body.menu-page .menu-card-actions .order-add {
            background: #fff0e5 !important;
            color: #d95b0b !important;
            border: 1px solid #f47721 !important;
        }

        /* FINAL ORDER NOW BUTTON COLOUR - VIGNADIGITAL */

        body.menu-page .menu-card-actions .order-now-btn,
        body.menu-page .menu-card-actions .order-now-btn:focus,
        body.menu-page .menu-card-actions .order-now-btn:visited {
            background: #356F6A !important;
            background-color: #356F6A !important;
            color: #FFFFFF !important;
            border: 1px solid #356F6A !important;
            box-shadow: none !important;
            border-radius: 9px !important;
            font-weight: 700 !important;
            opacity: 1 !important;
        }

        body.menu-page .menu-card-actions .order-now-btn:hover {
            background: #285752 !important;
            background-color: #285752 !important;
            border-color: #285752 !important;
        }

        body.menu-page .menu-card-actions .order-now-btn:active {
            background: #285752 !important;
            transform: scale(0.97);
        }

        /* =========================================
   GRID / LIST VIEW SWITCH
========================================= */

        body.menu-page .vigna-view-switch {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 4px;
            background: #202024;
            border: 1px solid #34343a;
            border-radius: 12px;
            width: fit-content;
        }

        body.menu-page .vigna-view-switch .view-toggle {
            width: 35px;
            height: 30px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #d1d1d5;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        body.menu-page .vigna-view-switch .view-toggle svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        body.menu-page .vigna-view-switch .view-toggle.active {
            background: #784b40;
            color: #ffffff;
        }

        body.menu-page .vigna-view-switch .view-toggle:hover {
            color: #ffffff;
        }

        /* =========================================
   DYNAMIC RESTAURANT THEME COLOUR
========================================= */

        body.menu-page {
            --vigna-theme: #d9480f;
            --vigna-theme-dark: #b9380b;
            --vigna-theme-light: #fff0e8;
            --vigna-theme-border: #e5a184;
        }

        body.menu-page .checkout-panel input:focus,
        body.menu-page .checkout-panel select:focus,
        body.menu-page .checkout-panel textarea:focus {
            outline-color: var(--vigna-theme) !important;
        }

        body.menu-page .checkout-panel .place-order,
        body.menu-page .receipt-actions button:not(.receipt-secondary),
        body.menu-page .menu-card-actions .order-now-btn {
            background: var(--vigna-theme) !important;
            border-color: var(--vigna-theme) !important;
            color: #fff !important;
        }

        body.menu-page .checkout-panel .place-order:hover,
        body.menu-page .receipt-actions button:not(.receipt-secondary):hover,
        body.menu-page .menu-card-actions .order-now-btn:hover {
            background: var(--vigna-theme-dark) !important;
        }

        body.menu-page .menu-card-actions .order-add {
            background: var(--vigna-theme-light) !important;
            color: var(--vigna-theme) !important;
            border-color: var(--vigna-theme-border) !important;
        }

        body.menu-page .checkout-panel h2,
        body.menu-page .checkout-panel .checkout-total {
            color: var(--vigna-theme) !important;
        }

        body.menu-page .receipt-total {
            border-top-color: var(--vigna-theme) !important;
            border-bottom-color: var(--vigna-theme) !important;
        }

        /* =========================================
   MOBILE RESPONSIVE DESIGN
========================================= */

        @media (max-width: 560px) {
            body.menu-page #cartBar.cart-bar {
                width: calc(100% - 16px) !important;
                bottom: max(8px, env(safe-area-inset-bottom)) !important;
                min-height: 58px;
                padding: 8px 8px 8px 12px !important;
                gap: 8px !important;
            }

            body.menu-page #cartBar.cart-bar>span {
                font-size: 13px;
                line-height: 1.25;
            }

            body.menu-page #cartBar.cart-bar>span small {
                font-size: 10px;
            }

            body.menu-page #cartBar.cart-bar>strong {
                font-size: 12px;
                padding: 10px 11px !important;
                white-space: nowrap;
            }

            body.menu-page {
                padding-bottom: 88px;
            }

            body.menu-page .checkout-overlay {
                padding: 6px !important;
            }

            body.menu-page .checkout-panel {
                max-height: 94dvh !important;
                padding: 22px 16px calc(18px + env(safe-area-inset-bottom)) !important;
            }
        }

        /* =========================================
   REDUCED MOTION
========================================= */

        @media (prefers-reduced-motion: no-preference) {
            body.menu-page #cartBar.cart-bar {
                transition: box-shadow .18s ease, transform .18s ease;
            }

            body.menu-page #cartBar.cart-bar:active {
                transform: translateX(-50%) scale(.99) !important;
            }
        }

        /* REMOVE THE OUTER BOX AROUND ORDER BUTTONS */

        body.menu-page .menu-card-actions {
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        /* REMOVE ANY EXTRA WRAPPER DECORATION */

        body.menu-page .menu-card-actions::before,
        body.menu-page .menu-card-actions::after {
            content: none !important;
            display: none !important;
        }

        /* FINAL ORDER NOW BUTTON COLOUR - VIGNADIGITAL */

        body.menu-page .menu-card-actions .order-now-btn,
        body.menu-page .menu-card-actions .order-now-btn:focus,
