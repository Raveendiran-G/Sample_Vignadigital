<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9480f" id="themeMeta">
  <title>Menu</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Floating cart: summary stays on the left, action stays on the right. */
    body.menu-page #cartBar.cart-bar {
      position: fixed !important;
      left: 50% !important;
      right: auto !important;
      bottom: max(12px, env(safe-area-inset-bottom)) !important;
      top: auto !important;
      transform: translateX(-50%) !important;
      z-index: 10000 !important;
      width: min(1000px, calc(100% - 24px)) !important;
      min-height: 58px;
      margin: 0 !important;
      padding: 9px 10px 9px 18px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 14px !important;
      border: 0;
      border-radius: 13px;
      box-sizing: border-box;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .24);
      text-align: left !important;
      cursor: pointer;
    }

    body.menu-page #cartBar.cart-bar>span {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
    }

    body.menu-page #cartBar.cart-bar>strong {
      flex: 0 0 auto;
      margin-left: auto;
      text-align: center;
    }

    body.menu-page #cartBar[hidden] {
      display: none !important;
    }

    /* Checkout uses the same warm cream, brown and orange palette as the restaurant menu. */
    body.menu-page .checkout-overlay {
      position: fixed !important;
      inset: 0 !important;
      z-index: 20000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow-y: auto !important;
      background: rgba(32, 19, 14, .76) !important;
      padding: 14px !important;
      box-sizing: border-box !important;
    }

    body.menu-page .checkout-panel {
      position: relative !important;
      display: block !important;
      width: min(520px, 100%) !important;
      margin: auto !important;
      overflow-y: auto !important;
      box-sizing: border-box !important;
    }

    body.menu-page .checkout-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e7d8cb;
    }

    body.menu-page .checkout-qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.menu-page .checkout-totals {
      margin: 16px 0;
    }

    body.menu-page .checkout-totals>div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }

    body.menu-page .checkout-total {
      border-top: 1px dashed #bba18d;
      margin-top: 8px;
      padding-top: 10px !important;
      font-size: 1.1rem;
      font-weight: 800;
    }

    body.menu-page #placeOrderForm {
      display: grid;
      gap: 12px;
    }

    body.menu-page #placeOrderForm label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    body.menu-page .checkout-close {
      position: absolute;
      top: 10px;
      right: 10px;
      min-width: 36px;
      min-height: 36px;
      cursor: pointer;
    }

    body.menu-page .checkout-panel h2 {
      padding-right: 44px;
    }

    body.menu-page .checkout-panel .place-order {
      min-height: 44px;
      cursor: pointer;
    }

    body.menu-page .receipt-stage {
      position: relative;
      padding-top: 20px;
    }

    body.menu-page .animated-receipt {
      background: #fffdf7;
      color: #493328;
      width: min(100%, 340px);
      box-sizing: border-box;
      margin: 0 auto;
      padding: 22px 18px;
      font: 12px/1.5 monospace;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
      animation: receiptDrop .8s ease both;
    }

    body.menu-page .animated-receipt p {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    body.menu-page .animated-receipt table {
      width: 100%;
      border-collapse: collapse;
    }

    body.menu-page .animated-receipt td:last-child {
      text-align: right;
      white-space: nowrap;
    }

    body.menu-page .receipt-brand,
    body.menu-page .receipt-sub,
    body.menu-page .animated-receipt h3,
    body.menu-page .receipt-thanks {
      text-align: center;
    }

    body.menu-page .receipt-printer {
      text-align: center;
      background: #292929;
      color: #e9b777;
      padding: 12px;
      border-radius: 12px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    body.menu-page .receipt-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    body.menu-page .receipt-actions>button {
      flex: 1;
      min-height: 42px;
    }

    body.menu-page .order-status {
      text-align: center;
      margin-top: 12px;
    }

    @keyframes receiptDrop {
      from {
        opacity: 0;
        transform: translateY(-24px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    body.menu-page .checkout-panel {
      background: #fffaf1 !important;
      color: #4d3429 !important;
      border: 1px solid #e7d4c2;
      border-radius: 20px !important;
      max-height: min(92dvh, 900px) !important;
      padding: 24px 20px calc(20px + env(safe-area-inset-bottom)) !important;
    }

    body.menu-page .checkout-panel h2,
    body.menu-page .checkout-panel .checkout-total {
      color: #603123 !important;
    }

    body.menu-page .checkout-line {
      border-bottom-color: #e7d8cb !important;
    }

    body.menu-page .checkout-qty button {
      background: #f8e8d8 !important;
      color: #603123 !important;
      border: 1px solid #ead3c0;
      border-radius: 8px;
      min-width: 32px;
      min-height: 32px;
    }

    body.menu-page .checkout-panel input,
    body.menu-page .checkout-panel select,
    body.menu-page .checkout-panel textarea {
      background: #fffdf9 !important;
      color: #3d2a22 !important;
      border: 1px solid #d9c4b4 !important;
      border-radius: 10px !important;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      padding: 12px !important;
    }

    body.menu-page .checkout-panel input:focus,
    body.menu-page .checkout-panel select:focus,
    body.menu-page .checkout-panel textarea:focus {
      outline: 2px solid #f58220;
      outline-offset: 1px;
    }

    body.menu-page .checkout-panel .place-order {
      background: #f58220 !important;
      color: #fff !important;
      border: 0;
      border-radius: 10px;
    }

    body.menu-page .checkout-panel .place-order:hover {
      background: #df6b12 !important;
    }

    body.menu-page .checkout-close {
      background: #f4e7dc !important;
      color: #603123 !important;
      border: 0;
      border-radius: 9px;
    }

    @media (max-width: 560px) {
      body.menu-page #cartBar.cart-bar {
        width: calc(100% - 16px) !important;
        bottom: max(8px, env(safe-area-inset-bottom)) !important;
        min-height: 58px;
        padding: 8px 8px 8px 12px !important;
        gap: 8px !important;
      }

      body.menu-page #cartBar.cart-bar>span {
        font-size: 13px;
        line-height: 1.25;
      }

      body.menu-page #cartBar.cart-bar>span small {
        font-size: 10px;
      }

      body.menu-page #cartBar.cart-bar>strong {
        font-size: 12px;
        padding: 10px 11px !important;
        white-space: nowrap;
      }

      body.menu-page {
        padding-bottom: 88px;
      }

      body.menu-page .checkout-overlay {
        padding: 6px !important;
      }

      body.menu-page .checkout-panel {
        max-height: 94dvh !important;
        padding: 22px 16px calc(18px + env(safe-area-inset-bottom)) !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      body.menu-page #cartBar.cart-bar {
        transition: box-shadow .18s ease, transform .18s ease;
      }

      body.menu-page #cartBar.cart-bar:active {
        transform: translateX(-50%) scale(.99) !important;
      }
    }

    /* Receipt printer and final-paper animation */
    /* Hide the checkout panel's white card behind both animation stages. */
    body.menu-page .checkout-panel.receipt-mode {
      background: transparent !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
      overflow: visible !important;
      max-height: none !important;
      width: min(100%, 410px) !important;
    }

    body.menu-page .receipt-animation-wrap {
      width: 100%;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: 8px 0 18px;
    }

    body.menu-page .receipt-printer-stage {
      width: min(100%, 360px);
      text-align: center;
      animation: printerEnter .55s ease both;
    }

    body.menu-page .printer-brand {
      color: #fff4e8;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px #0008;
    }

    body.menu-page .receipt-printing-paper {
      width: 78%;
      min-height: 210px;
      margin: 0 auto -3px;
      padding: 18px 14px 25px;
      background: #fffdf7;
      color: #493328;
      box-shadow: none;
      position: relative;
      padding-bottom: 12px;
      animation: paperFeed 1.8s ease-in-out both;
    }

    /* Small, neat torn-paper edge (matching the supplied reference). */
    body.menu-page .receipt-printing-paper::after,
    body.menu-page .receipt-final-paper::after {
      content: "";
      display: block;
      height: 12px;
      margin: 8px -18px -12px;
      background: inherit;
      clip-path: polygon(0 0, 7.5% 100%, 15% 0, 22.5% 100%, 30% 0, 37.5% 100%, 45% 0, 52.5% 100%, 60% 0, 67.5% 100%, 75% 0, 82.5% 100%, 90% 0, 97.5% 100%, 100% 0);
    }

    body.menu-page .printing-logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    body.menu-page .receipt-printing-paper h2 {
      margin: 6px 0;
      font-size: 17px;
      color: #603123;
    }

    body.menu-page .receipt-printing-paper p {
      font-size: 10px;
      letter-spacing: 1px;
    }

    body.menu-page .printer-icon {
      font-size: 30px;
      margin-top: 12px;
    }

    body.menu-page .printer-machine {
      position: relative;
      z-index: 1;
      background: linear-gradient(#555, #222);
      color: #f5d6b7;
      padding: 18px 10px;
      border-radius: 12px 12px 18px 18px;
      box-shadow: 0 10px 20px #0003;
      font-size: 11px;
      letter-spacing: 1px;
    }

    body.menu-page .printer-machine span {
      display: block;
      height: 8px;
      background: #111;
      border-radius: 8px;
      margin: -10px 12px 12px;
    }

    body.menu-page .receipt-hidden {
      display: none !important;
    }

    body.menu-page .receipt-final-paper {
      width: min(100%, 360px);
      max-height: calc(92dvh - 28px);
      overflow: auto;
      margin: 0 auto;
      padding: 20px 18px 28px;
      box-sizing: border-box;
      background: #fffdf7;
      color: #493328;
      box-shadow: none;
      font: 12px/1.5 monospace;
      position: relative;
      padding-bottom: 12px;
      animation: receiptUnroll .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    body.menu-page .receipt-head,
    .receipt-foot {
      text-align: center;
    }

    body.menu-page .receipt-icon {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    body.menu-page .receipt-head h2 {
      margin: 5px 0;
      color: #603123;
    }

    body.menu-page .receipt-label {
      border-top: 1px dashed #9c8b7d;
      margin-top: 10px;
      padding-top: 8px;
      font-weight: 800;
    }

    body.menu-page .receipt-meta {
      font-size: 11px;
      margin: 10px 0;
    }

    body.menu-page .meta-line {
      display: grid;
      grid-template-columns: 76px 8px minmax(0, 1fr);
      gap: 4px;
      overflow-wrap: anywhere;
    }

    body.menu-page .receipt-items {
      border-top: 1px dashed #9c8b7d;
      border-bottom: 1px dashed #9c8b7d;
      margin: 10px 0;
      padding: 8px 0;
    }

    body.menu-page .receipt-table-head,
    body.menu-page .receipt-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 25px 48px 52px;
      gap: 3px;
      font-size: 9px;
      padding: 5px 0;
    }

    body.menu-page .receipt-table-head {
      font-weight: 800;
      border-bottom: 1px solid #ddd;
    }

    body.menu-page .receipt-table-head span:not(:first-child),
    body.menu-page .receipt-row span:not(:first-child),
    body.menu-page .receipt-row strong {
      text-align: right;
    }

    body.menu-page .receipt-row span:first-child {
      overflow-wrap: anywhere;
    }

    body.menu-page .receipt-summary-line,
    body.menu-page .receipt-total {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 0;
    }

    body.menu-page .receipt-total {
      border-top: 1px dashed #493328;
      border-bottom: 1px dashed #493328;
      margin-top: 5px;
      padding: 9px 0;
      font-weight: 900;
      font-size: 14px;
    }

    body.menu-page .receipt-foot {
      padding-top: 12px;
      line-height: 1.8;
    }

    body.menu-page .leaf-divider,
    .receipt-hearts {
      color: #8a4b2c;
      margin: 5px 0;
    }

    body.menu-page .receipt-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    body.menu-page .receipt-actions button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: 9px;
      background: #f58220;
      color: white;
      cursor: pointer;
    }

    body.menu-page .receipt-actions .receipt-secondary {
      background: #f4e7dc;
      color: #603123;
    }

    body.menu-page .order-status {
      text-align: center;
      margin-top: 10px;
    }

    @keyframes printerEnter {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @keyframes paperFeed {
      0% {
        transform: translateY(-90px);
        opacity: 0
      }

      35% {
        opacity: 1
      }

      100% {
        transform: translateY(0);
        opacity: 1
      }
    }

    @keyframes receiptUnroll {
      from {
        opacity: 0;
        transform: translateY(-35px) scaleY(.15);
        transform-origin: top
      }

      to {
        opacity: 1;
        transform: translateY(0) scaleY(1)
      }
    }

    body.menu-page #cartBar.cart-bar {
      background: #ffffff !important;
      background-color: #ffffff !important;
      color: #493328 !important;
      border: 1px solid #e5d5c6 !important;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .12) !important;
    }

    body.menu-page #cartBar.cart-bar strong {
      background: transparent !important;
      color: #493328 !important;
      border: none !important;
    }

    body.menu-page #cartBar.cart-bar:hover {
      background: #f5f5f5 !important;
    }
  </style>

</head>

<body class="menu-page">
  <div id="app">
    <div class="skel skel-hero"></div>
    <div style="max-width:1080px;margin:0 auto;padding:14px 12px">
      <div class="skel skel-row" style="border-radius:99px"></div>
      <div class="m-grid" style="margin-top:18px">
        <div class="skel skel-card"></div>
        <div class="skel skel-card"></div>
        <div class="skel skel-card"></div>
        <div class="skel skel-card"></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    const slug = location.pathname.split('/').pop();
    let data;
    const cart = new Map();
    let currentOrderEventSource = null;

    const menuMoney = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    const cartCount = () => [...cart.values()].reduce((n, x) => n + x.qty, 0);
    const cartTotal = () => [...cart.values()].reduce((n, x) => n + x.price * x.qty, 0);
    const taxAmount = () => Number((cartTotal() * 0.05).toFixed(2));
    const payableTotal = () => Number((cartTotal() + taxAmount()).toFixed(2));

    // Customer notification and cart button styling
    (function addCustomerStyles() {
        if (document.getElementById('customerNotificationStyles')) return;

        const style = document.createElement('style');
        style.id = 'customerNotificationStyles';
        style.textContent = `
            #customerOrderNotifications {
                position: fixed;
                top: 18px;
                right: 18px;
                z-index: 999999;
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: min(360px, calc(100vw - 36px));
                pointer-events: none;
            }

            .customer-order-notification {
                position: relative;
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 17px 42px 17px 17px;
                background: #fff;
                color: #33251e;
                border-left: 5px solid #e99a32;
                border-radius: 12px;
                box-shadow: 0 8px 28px rgba(0,0,0,.18);
                font-family: Arial, sans-serif;
                animation: customerNotificationIn .35s ease;
                pointer-events: auto;
            }

            .customer-order-notification.ready {
                border-left-color: #239b61;
            }

            .customer-order-notification .notification-icon {
                font-size: 25px;
                line-height: 1;
            }

            .customer-order-notification .notification-content {
                flex: 1;
                font-size: 14px;
                line-height: 1.5;
            }

            .customer-order-notification .notification-content strong {
                display: block;
                margin-bottom: 3px;
                font-size: 15px;
            }

            .customer-order-notification .notification-close {
                position: absolute;
                top: 8px;
                right: 10px;
                width: 27px;
                height: 27px;
                border: 0;
                border-radius: 50%;
                background: #f1f1f1;
                color: #333;
                font-size: 17px;
                cursor: pointer;
            }

            @keyframes customerNotificationIn {
                from {
                    opacity: 0;
                    transform: translateX(30px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            body.menu-page #cartBar.cart-bar,
            #cartBar.cart-bar {
                background: #fff !important;
                background-color: #fff !important;
                color: #493328 !important;
                border: 1px solid #e5d5c6 !important;
                box-shadow: 0 4px 18px rgba(0,0,0,.12) !important;
            }

            body.menu-page #cartBar.cart-bar strong,
            #cartBar.cart-bar strong {
                background: transparent !important;
                color: #493328 !important;
                border: 0 !important;
            }

            body.menu-page #cartBar.cart-bar:hover,
            #cartBar.cart-bar:hover {
                background: #f5f5f5 !important;
            }
        `;
        document.head.appendChild(style);
    })();

    // Notification container
    function showCustomerNotification(message, isReady = false) {
        let stack = document.getElementById('customerOrderNotifications');

        if (!stack) {
            stack = document.createElement('div');
            stack.id = 'customerOrderNotifications';
            stack.setAttribute('aria-live', 'polite');
            document.body.appendChild(stack);
        }

        const notification = document.createElement('div');
        notification.className = 'customer-order-notification' + (isReady ? ' ready' : '');

        const icon = isReady ? '✅' : '🍳';
        const heading = isReady ? 'Order Ready!' : 'Order Update';

        notification.innerHTML = `
            <span class="notification-icon">${icon}</span>
            <div class="notification-content">
                <strong>${heading}</strong>
                <span></span>
            </div>
            <button type="button" class="notification-close" aria-label="Close notification">×</button>
        `;

        notification.querySelector('.notification-content span').textContent = message;

        notification.querySelector('.notification-close').addEventListener('click', () => {
            notification.remove();

            if (!stack.children.length) {
                stack.remove();
            }
        });

        stack.appendChild(notification);
    }

    // Listen for live order status updates from the restaurant
    function listenForOrderUpdates(orderId, orderNumber) {
        if (!orderId) return null;

        // Close any previous order connection
        if (currentOrderEventSource) {
            currentOrderEventSource.close();
        }

        const eventSource = new EventSource(
            `/api/v1/public/orders/${encodeURIComponent(orderId)}/events`
        );

        currentOrderEventSource = eventSource;

        eventSource.addEventListener('order-status', function(event) {
            try {
                const update = JSON.parse(event.data);
                const status = String(update.status || '').toLowerCase();

                if (status === 'preparing') {
                    showCustomerNotification(
                        `Your order #${orderNumber} is now being prepared!`,
                        false
                    );
                }

                if (status === 'ready') {
                    showCustomerNotification(
                        `Your order #${orderNumber} is ready!`,
                        true
                    );

                    eventSource.close();

                    if (currentOrderEventSource === eventSource) {
                        currentOrderEventSource = null;
                    }
                }
            } catch (error) {
                console.error('Order notification error:', error);
            }
        });

        eventSource.onerror = function(error) {
            console.log('Reconnecting to order notifications...', error);
        };

        return eventSource;
    }

    const thumb = (i) => i.image
        ? `<div class="thumb"><img src="${esc(i.image)}" alt="${esc(i.name)}" loading="lazy" decoding="async"></div>`
        : `<div class="thumb" aria-hidden="true">${esc(i.name.trim().charAt(0).toUpperCase())}</div>`;

    const card = (i) => `
        <article class="m-card order-card" data-item="${i.id}">
            ${thumb(i)}
            <div class="b">
                <div class="nm">${esc(i.name)}</div>
                ${i.description ? `<div class="ds">${esc(i.description)}</div>` : ''}
                <div class="pr">${rupees(i.price)}</div>
                ${data?.restaurant?.order_enabled === false ? '' : `
                    <button class="order-add" data-add="${i.id}" type="button">
                        ${cart.has(Number(i.id)) ? 'Added · ' + cart.get(Number(i.id)).qty : '＋ Add to cart'}
                    </button>
                `}
            </div>
        </article>
    `;

    function render(filter = '') {
        const q = filter.trim().toLowerCase();

        const cats = data.categories
            .map((c) => ({
                ...c,
                items: c.items.filter((i) =>
                    !q ||
                    i.name.toLowerCase().includes(q) ||
                    i.description.toLowerCase().includes(q)
                )
            }))
            .filter((c) => c.items.length);

        $('#chips').innerHTML = cats.map((c, n) => `
            <button class="chip ${n === 0 ? 'on' : ''}" data-cat="${c.id}">
                ${esc(c.name)}
            </button>
        `).join('');

        $('#sections').innerHTML = cats.length
            ? cats.map((c) => `
                <section class="m-sec" id="cat-${c.id}" data-cat="${c.id}">
                    <h2>
                        ${esc(c.name)}
                        <span>${c.items.length} item${c.items.length > 1 ? 's' : ''}</span>
                    </h2>
                    <div class="m-grid">${c.items.map(card).join('')}</div>
                </section>
            `).join('')
            : `<p class="muted" style="text-align:center;padding:48px 0">
                ${q ? 'No dishes match your search.' : 'The menu is being updated. Please check back soon.'}
              </p>`;

        observe();
    }

    let io, lockUntil = 0;

    function observe() {
        io?.disconnect();

        io = new IntersectionObserver((entries) => {
            const vis = entries
                .filter((e) => e.isIntersecting)
                .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];

            if (vis && Date.now() > lockUntil) {
                setActive(vis.target.dataset.cat, false);
            }
        }, { rootMargin: '-120px 0px -65% 0px' });

        document.querySelectorAll('.m-sec').forEach((s) => io.observe(s));
    }

    function setActive(id, scroll = true) {
        document.querySelectorAll('.chip').forEach((c) => {
            const on = c.dataset.cat === String(id);
            c.classList.toggle('on', on);

            if (on) {
                c.scrollIntoView({
                    inline: 'center',
                    block: 'nearest',
                    behavior: scroll ? 'smooth' : 'auto'
                });
            }
        });
    }

    function openItem(id) {
        const i = data.categories.flatMap((c) => c.items).find((x) => x.id === id);
        if (!i) return;

        const el = document.createElement('div');
        el.className = 'sheet';
        el.setAttribute('role', 'dialog');
        el.setAttribute('aria-modal', 'true');

        el.innerHTML = `
            <div class="sheet-wrap">
                <button class="sheet-close" aria-label="Close">✕</button>
                <div class="sheet-box">
                    ${thumb(i)}
                    <div class="sheet-body">
                        <h2>${esc(i.name)}</h2>
                        <div class="pr">${rupees(i.price)}</div>
                        ${i.description ? `<p>${esc(i.description)}</p>` : ''}
                    </div>
                </div>
            </div>
        `;

        const close = () => {
            el.remove();
            document.body.style.overflow = '';
            document.removeEventListener('keydown', onKey);
        };

        const onKey = (e) => {
            if (e.key === 'Escape') close();
        };

        el.addEventListener('click', (e) => {
            if (e.target === el || e.target.closest('.sheet-close')) close();
        });

        document.addEventListener('keydown', onKey);
        document.body.appendChild(el);
        document.body.style.overflow = 'hidden';
    }

    function updateCartBar() {
        let bar = document.getElementById('cartBar');

        if (!bar) {
            bar = document.createElement('button');
            bar.id = 'cartBar';
            bar.className = 'cart-bar';
            bar.type = 'button';
            document.body.appendChild(bar);
        }

        bar.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();

            if (cartCount() > 0) openCheckout();
        };

        bar.onkeydown = (event) => {
            if ((event.key === 'Enter' || event.key === ' ') && cartCount() > 0) {
                event.preventDefault();
                openCheckout();
            }
        };

        bar.disabled = cartCount() === 0 || data?.restaurant?.order_enabled === false;
        bar.hidden = bar.disabled;

        bar.setAttribute(
            'aria-label',
            `View cart and order, ${cartCount()} items, ${menuMoney(cartTotal())}`
        );

        bar.innerHTML = `
            <span>
                ${cartCount()} item${cartCount() === 1 ? '' : 's'} · ${menuMoney(cartTotal())}
                <small style="display:block;font-weight:400;opacity:.9">
                    Review your items and confirm your order
                </small>
            </span>
            <strong>View cart / Order →</strong>
        `;

        document.querySelectorAll('[data-add]').forEach(b => {
            const x = cart.get(Number(b.dataset.add));
            b.textContent = x ? `Added · ${x.qty}` : '＋ Add';
        });
    }

    function openCheckout() {
        const old = document.getElementById('checkoutSheet');
        if (old) old.remove();

        if (!cartCount()) return;

        const el = document.createElement('div');
        el.className = 'checkout-overlay';
        el.id = 'checkoutSheet';

        const rows = () => [...cart.values()].map(x => `
            <div class="checkout-line">
                <div>
                    <b>${esc(x.name)}</b>
                    <div class="muted">${menuMoney(x.price)} each</div>
                </div>
                <div class="checkout-qty">
                    <button type="button" data-dec="${x.id}">−</button>
                    <span>${x.qty}</span>
                    <button type="button" data-inc="${x.id}">+</button>
                </div>
                <b>${menuMoney(x.qty * x.price)}</b>
            </div>
        `).join('');

        el.innerHTML = `
            <section class="checkout-panel">
                <button type="button" class="checkout-close" aria-label="Close">✕</button>
                <h2>Your order</h2>

                <div id="checkoutLines">${rows()}</div>

                <div class="checkout-totals">
                    <div>
                        <span>Food Subtotal</span>
                        <strong id="subtotalValue">${menuMoney(cartTotal())}</strong>
                    </div>
                    <div>
                        <span>Tax (5%)</span>
                        <strong id="taxValue">${menuMoney(taxAmount())}</strong>
                    </div>
                    <div class="checkout-total">
                        <span>Total</span>
                        <strong id="totalValue">${menuMoney(payableTotal())}</strong>
                    </div>
                </div>

                <form id="placeOrderForm">
                    <label>
                        Your name
                        <input name="customer" required maxlength="100" autocomplete="name">
                    </label>

                    <label>
                        Mobile number
                        <input name="phone" required maxlength="30" autocomplete="tel" inputmode="tel">
                    </label>

                    <label>
                        Order type
                        <select name="order_type" id="orderType">
                            <option>Dine In</option>
                            <option>Takeaway</option>
                            <option>Delivery</option>
                        </select>
                    </label>

                    <label id="tableField">
                        Table Number
                        <input name="table_no" id="tableNo" required maxlength="30" placeholder="e.g. 12">
                    </label>

                    <label>
                        Special instructions
                        <textarea name="note" maxlength="500" rows="2" placeholder="Optional"></textarea>
                    </label>

                    <button class="place-order" type="submit">Confirm Order</button>

                    <p class="muted checkout-hint">
                        Confirm to generate your animated order receipt.
                    </p>

                    <div id="orderMessage" role="status"></div>
                </form>
            </section>
        `;

        document.body.appendChild(el);
        document.body.style.overflow = 'hidden';

        const close = () => {
            el.remove();
            document.body.style.overflow = '';
        };

        el.querySelector('.checkout-close').onclick = close;

        el.addEventListener('click', e => {
            if (e.target === el) close();
        });

        const refresh = () => {
            el.querySelector('#checkoutLines').innerHTML = rows();
            el.querySelector('#subtotalValue').textContent = menuMoney(cartTotal());
            el.querySelector('#taxValue').textContent = menuMoney(taxAmount());
            el.querySelector('#totalValue').textContent = menuMoney(payableTotal());
            updateCartBar();
        };

        const orderType = el.querySelector('#orderType');
        const tableField = el.querySelector('#tableField');
        const tableNo = el.querySelector('#tableNo');

        orderType.addEventListener('change', () => {
            const dine = orderType.value === 'Dine In';
            tableField.hidden = !dine;
            tableNo.required = dine;

            if (!dine) tableNo.value = '';
        });

        el.addEventListener('click', e => {
            const dec = e.target.closest('[data-dec]');
            const inc = e.target.closest('[data-inc]');

            if (!dec && !inc) return;

            const id = Number((dec || inc).dataset[dec ? 'dec' : 'inc']);
            const item = cart.get(id);

            if (!item) return;

            if (dec) {
                if (item.qty <= 1) cart.delete(id);
                else item.qty--;
            } else if (item.qty < 20) {
                item.qty++;
            }

            if (!cartCount()) {
                close();
                updateCartBar();
                return;
            }

            refresh();
        });

        el.querySelector('#placeOrderForm').addEventListener('submit', async e => {
            e.preventDefault();

            const form = e.currentTarget;
            const btn = form.querySelector('button[type="submit"]');
            const msg = el.querySelector('#orderMessage');

            btn.disabled = true;
            btn.textContent = 'Submitting…';
            msg.textContent = '';

            try {
                const fd = new FormData(form);

                const response = await fetch('/api/v1/public/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slug: data.restaurant.slug,
                        customer: fd.get('customer'),
                        phone: fd.get('phone'),
                        note: fd.get('note'),
                        order_type: fd.get('order_type'),
                        table_no: fd.get('table_no'),
                        items: [...cart.values()].map(x => ({
                            id: x.id,
                            qty: x.qty
                        }))
                    })
                });

                const responseData = await response.json();

                if (!response.ok) {
                    throw new Error(responseData.error || 'Could not place order');
                }

                const result = responseData.order || responseData;

                if (!result.id || !Array.isArray(result.items) || result.items.length === 0) {
                    throw new Error('Invalid order response from server. Please check the orders API.');
                }

                // Save the order and start live notifications
                localStorage.setItem('dm-order-' + result.id, JSON.stringify(result));

                listenForOrderUpdates(
                    result.id,
                    result.order_no ?? result.id
                );

                cart.clear();
                updateCartBar();

                const panel = el.querySelector('.checkout-panel');

                panel.classList.add('receipt-mode');

                const orderTypeText = fd.get('order_type');

                panel.innerHTML = `
                    <div class="receipt-animation-wrap">
                        <section class="receipt-printer-stage" id="receiptPrinterStage">
                            <div class="printer-brand">NEW DESI TADKA</div>

                            <div class="receipt-printing-paper">
                                <div class="printing-logo">
                                    <img src="/images/logo.png" alt="New Desi Tadka">
                                </div>
                                <h2>NEW DESI TADKA</h2>
                                <p>FROM FARM TO TABLE · 100% VEG</p>
                                <hr>
                                <strong>Preparing your bill...</strong>
                                <div class="printer-icon">▤</div>
                            </div>

                            <div class="printer-machine">
                                <span></span>
                                <b>THERMAL RECEIPT PRINTER</b>
                            </div>
                        </section>

                        <section class="receipt-final-paper receipt-hidden" id="receiptFinalPaper">
                            <header class="receipt-head">
                                <img class="receipt-icon" src="/images/logo.png" alt="New Desi Tadka logo">
                                <h2>${esc(data.restaurant.name)}</h2>
                                <p>FROM FARM TO TABLE</p>
                                <p>100% VEG</p>
                                <p class="receipt-label">ORDER RECEIPT</p>
                            </header>

                            <div class="receipt-meta">
                                <div class="meta-line">
                                    <span>Order No</span>
                                    <span>:</span>
                                    <strong>${esc(result.order_no ?? result.id)}</strong>
                                </div>

                                <div class="meta-line">
                                    <span>Date</span>
                                    <span>:</span>
                                    <span>${esc(new Date().toLocaleString('en-IN'))}</span>
                                </div>

                                <div class="meta-line">
                                    <span>Customer</span>
                                    <span>:</span>
                                    <span>${esc(fd.get('customer'))}</span>
                                </div>

                                <div class="meta-line">
                                    <span>Phone</span>
                                    <span>:</span>
                                    <span>${esc(fd.get('phone'))}</span>
                                </div>

                                <div class="meta-line">
                                    <span>Order Type</span>
                                    <span>:</span>
                                    <span>${esc(orderTypeText)}</span>
                                </div>

                                ${orderTypeText === 'Dine In' ? `
                                    <div class="meta-line">
                                        <span>Table No.</span>
                                        <span>:</span>
                                        <span>${esc(fd.get('table_no'))}</span>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="receipt-items">
                                <div class="receipt-table-head">
                                    <span>Item</span>
                                    <span>Qty</span>
                                    <span>Price</span>
                                    <span>Total</span>
                                </div>

                                ${result.items.map(i => `
                                    <div class="receipt-row">
                                        <span>${esc(i.name)}</span>
                                        <span>${Number(i.qty)}</span>
                                        <span>${menuMoney(i.price)}</span>
                                        <strong>${menuMoney(i.line_total)}</strong>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="receipt-summary-line">
                                <span>Food Subtotal</span>
                                <strong>${menuMoney(result.subtotal)}</strong>
                            </div>

                            <div class="receipt-summary-line">
                                <span>Tax (5%)</span>
                                <strong>${menuMoney(result.tax)}</strong>
                            </div>

                            <div class="receipt-total">
                                <span>Total</span>
                                <strong>${menuMoney(result.total)}</strong>
                            </div>

                            <footer class="receipt-foot">
                                <strong>Thank you for ordering!</strong>
                                <div>We will confirm your order shortly.</div>
                                <div class="leaf-divider">◆</div>
                                <strong>New Desi Tadka</strong>
                                <div>Good Food Brings People Together</div>
                                <div class="receipt-hearts">♥ ♥ ♥</div>
                            </footer>

                            <div class="receipt-actions">
                                <button type="button" class="receipt-secondary" id="backMenu">
                                    ⌂ &nbsp; Back to Menu
                                </button>
                                <button type="button" id="printReceipt">Print Receipt</button>
                            </div>

                            <p class="order-status" id="liveStatus">Status: Pending</p>
                        </section>
                    </div>
                `;

                // Show printer animation, then reveal the receipt
                window.setTimeout(() => {
                    const printer = panel.querySelector('#receiptPrinterStage');
                    const receipt = panel.querySelector('#receiptFinalPaper');

                    if (!printer || !receipt) return;

                    printer.classList.add('receipt-hidden');
                    receipt.classList.remove('receipt-hidden');
                }, 2200);

                panel.querySelector('#backMenu').onclick = close;

                panel.querySelector('#printReceipt').onclick = () => {
                    const receipt = panel.querySelector('#receiptFinalPaper');

                    const printWindow = window.open('', '_blank', 'width=420,height=700');

                    if (!printWindow) {
                        alert('Please allow popups to print the receipt.');
                        return;
                    }

                    printWindow.document.write(`
                        <!doctype html>
                        <html>
                        <head>
                            <title>Receipt ${esc(result.order_no ?? result.id)}</title>
                            <style>
                                * { box-sizing: border-box; }

                                body {
                                    margin: 0;
                                    padding: 4mm;
                                    font-family: Arial, sans-serif;
                                    background: #fff;
                                }

                                .receipt-final-paper {
                                    position: relative;
                                    width: 72mm;
                                    margin: auto;
                                    padding: 4mm 4mm 7mm;
                                    color: #29241f;
                                    font-size: 10px;
                                    background: #fffdf7;
                                }

                                .receipt-final-paper::after {
                                    content: "";
                                    display: block;
                                    height: 4mm;
                                    margin: 2mm -4mm -7mm;
                                    background: inherit;
                                    clip-path: polygon(
                                        0 0,7.5% 100%,15% 0,22.5% 100%,
                                        30% 0,37.5% 100%,45% 0,52.5% 100%,
                                        60% 0,67.5% 100%,75% 0,82.5% 100%,
                                        90% 0,97.5% 100%,100% 0
                                    );
                                }

                                .receipt-head {
                                    text-align: center;
                                    border-bottom: 1px dashed #999;
                                    padding-bottom: 8px;
                                }

                                .receipt-icon {
                                    width: 48px;
                                    height: 48px;
                                    object-fit: contain;
                                }

                                .receipt-label {
                                    border-top: 1px dashed #999;
                                    padding-top: 7px;
                                    font-weight: bold;
                                }

                                .receipt-meta {
                                    font-size: 10px;
                                    line-height: 1.7;
                                    padding-top: 8px;
                                }

                                .meta-line {
                                    display: grid;
                                    grid-template-columns: 68px 8px 1fr;
                                    gap: 3px;
                                }

                                .receipt-items {
                                    border-top: 1px dashed #999;
                                    border-bottom: 1px dashed #999;
                                    margin: 8px 0;
                                    padding: 6px 0;
                                }

                                .receipt-table-head,
                                .receipt-row {
                                    display: grid;
                                    grid-template-columns: minmax(0,1fr) 18px 37px 40px;
                                    gap: 2px;
                                    font-size: 8px;
                                    padding: 4px 0;
                                }

                                .receipt-table-head span:not(:first-child),
                                .receipt-row span:not(:first-child),
                                .receipt-row strong {
                                    text-align: right;
                                }

                                .receipt-summary-line,
                                .receipt-total {
                                    display: flex;
                                    justify-content: space-between;
                                    padding: 4px 0;
                                }

                                .receipt-total {
                                    border-top: 1px dashed #333;
                                    border-bottom: 1px dashed #333;
                                    font-weight: bold;
                                    margin-top: 5px;
                                    padding: 8px 0;
                                }

                                .receipt-foot {
                                    text-align: center;
                                    line-height: 1.7;
                                    padding-top: 10px;
                                }

                                .receipt-actions,
                                .order-status {
                                    display: none !important;
                                }

                                @page {
                                    size: 80mm auto;
                                    margin: 3mm;
                                }
                            </style>
                        </head>
                        <body>${receipt.outerHTML}</body>
                        </html>
                    `);

                    printWindow.document.close();
                    printWindow.onload = () => printWindow.print();
                };

                // Keep the receipt status updated as a backup to live notifications
                const statusEl = panel.querySelector('#liveStatus');

                const pollStatus = async () => {
                    try {
                        const statusResponse = await fetch(
                            '/api/v1/public/orders/' + encodeURIComponent(result.id),
                            { cache: 'no-store' }
                        );

                        if (!statusResponse.ok) return;

                        const statusData = await statusResponse.json();

                        statusEl.textContent = 'Status: ' +
                            String(statusData.status || 'pending').replaceAll('_', ' ');

                    } catch (error) {
                        console.error('Order status error:', error);
                    }
                };

                pollStatus();

                const statusTimer = window.setInterval(() => {
                    if (!document.body.contains(el)) {
                        window.clearInterval(statusTimer);
                        return;
                    }

                    pollStatus();
                }, 5000);

            } catch (err) {
                msg.textContent = err.message || 'Could not place order';
                btn.disabled = false;
                btn.textContent = `Confirm order · ${menuMoney(cartTotal())}`;
            }
        });
    }

    // Load restaurant menu
    (async function init() {
        try {
            data = await api('/api/v1/public/menu/' + encodeURIComponent(slug));
        } catch {
            $('#app').innerHTML = `
                <div style="text-align:center;padding:96px 20px">
                    <h2>Menu not found</h2>
                    <p class="muted">This menu link is not available.</p>
                </div>
            `;
            return;
        }

        const r = data.restaurant;

        document.title = `${r.name} · Menu`;

        document.documentElement.style.setProperty('--theme', r.theme_color);
        document.body.style.setProperty('--theme', r.theme_color);

        $('#themeMeta').content = r.theme_color;

        $('#app').innerHTML = `
            <header class="m-hero">
                ${r.logo ? `<img src="${esc(r.logo)}" alt="">` : ''}
                <h1>${esc(r.name)}</h1>
                ${r.tagline ? `<p>${esc(r.tagline)}</p>` : ''}
                ${r.city ? `<div class="small">${esc(r.city)}</div>` : ''}
            </header>

            <div class="m-bar">
                <div class="m-search">
                    <input
                        type="search"
                        id="q"
                        placeholder="Search dishes"
                        aria-label="Search dishes"
                        autocomplete="off"
                    >
                    <div id="layout"></div>
                </div>

                <div class="m-chips" id="chips" role="tablist"></div>
            </div>

            <main class="m-wrap" id="sections"></main>

            <footer class="m-foot">
                ${r.address ? esc(r.address) + '<br>' : ''}
                ${r.phone ? `<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : ''}
            </footer>
        `;

        render();

        viewToggle(
            $('#layout'),
            'dm_view_menu',
            (m) => $('#sections').classList.toggle('as-list', m === 'list')
        );

        addEventListener('scroll', () => {
            if (
                Date.now() > lockUntil &&
                innerHeight + scrollY >= document.documentElement.scrollHeight - 4
            ) {
                const last = [...document.querySelectorAll('.m-sec')].pop();
                if (last) setActive(last.dataset.cat, false);
            }
        }, { passive: true });

        $('#q').addEventListener('input', (e) => render(e.target.value));

        $('#chips').addEventListener('click', (e) => {
            const c = e.target.closest('.chip');
            if (!c) return;

            lockUntil = Date.now() + 1000;
            setActive(c.dataset.cat);

            document.getElementById('cat-' + c.dataset.cat)?.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        });

        $('#sections').addEventListener('click', (e) => {
            const add = e.target.closest('[data-add]');

            if (add) {
                const id = Number(add.dataset.add);

                const item = data.categories
                    .flatMap(c => c.items)
                    .find(i => Number(i.id) === id);

                if (!item) return;

                const existing = cart.get(id);

                if (existing) {
                    existing.qty = Math.min(20, existing.qty + 1);
                } else {
                    cart.set(id, {
                        id,
                        name: item.name,
                        price: Number(item.price),
                        qty: 1
                    });
                }

                updateCartBar();
                return;
            }

            const c = e.target.closest('.m-card');

            if (c && !e.target.closest('button')) {
                openItem(Number(c.dataset.item));
            }
        });

        updateCartBar();
    })();
</script>
</body>
