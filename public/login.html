<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/style.css">
  <title>Log in · Digital Menu</title>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro" aria-labelledby="login-intro-title">
      <div class="login-brand">
        <div class="login-brand-mark mark" data-ico="menu" aria-hidden="true"></div>
        <span>Digital Menu</span>
      </div>

      <div class="login-intro-copy">
        <h1 id="login-intro-title">Manage your menu from anywhere.</h1>
        <p>Add dishes, update prices and share one QR code with your guests.</p>
      </div>

      <p class="login-footnote">
        Restaurants are onboarded by our team. Your login is shared with you after onboarding.
      </p>
    </section>

    <section class="login-form-panel" aria-labelledby="login-title">
      <div class="login-form-box">
        <h2 id="login-title">Welcome back</h2>
        <p class="login-subtitle">Log in to your dashboard.</p>

        <form id="f">
          <label for="identifier">Mobile number or email</label>
          <input id="identifier" name="identifier" type="text" required autocomplete="username" autofocus placeholder="9876543210 or you@restaurant.com">

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">

          <div class="err login-error" id="err" role="alert"></div>
          <button class="lg login-submit" type="submit">Log in</button>
        </form>

        <p class="login-back"><a href="/">← Back to home</a></p>
      </div>
    </section>
  </main>
<script src="/app.js"></script>
<script>
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#err').textContent = '';
  try { const { role } = await api('/api/v1/auth/session', 'POST', Object.fromEntries(new FormData(e.target))); location.href = role === 'admin' ? '/admin' : '/dashboard'; }
  catch (er) { $('#err').textContent = er.message; }
});
</script>
</body></html>
