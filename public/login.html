<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/style.css">

  <title>Log in · Digital Menu</title>

  <style>
    /* =========================================
     PASSWORD FIELD AND SHOW/HIDE EYE
     ========================================= */

    .password-field {
      position: relative;
      display: block;
      width: 100%;
    }

    .password-field input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding-right: 48px !important;
    }

    /* Eye button */
    .password-field .password-toggle {
      position: absolute;
      top: 35%;
      right: 10px;
      transform: translateY(-50%);

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0;
      padding: 0;

      border: none;
      border-radius: 6px;
      outline: none;

      background: transparent;
      color: #000000;

      cursor: pointer;
      line-height: 1;
    }

    /* Eye icon */
    .password-field .password-toggle svg {
      display: block;
      width: 18px;
      height: 18px;

      fill: none;
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Hover */
    .password-field .password-toggle:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #000000;
    }

    /* Focus */
    .password-field .password-toggle:focus-visible {
      outline: 2px solid #f56623;
      outline-offset: 2px;
    }

    /* Prevent inherited button styles from moving the icon */
    .password-field .password-toggle:active {
      transform: translateY(-50%);
    }
  </style>
</head>

<body class="login-page">

  <main class="login-shell">

    <!-- LEFT INTRO PANEL -->

    <section class="login-intro" aria-labelledby="login-intro-title">

      <div class="login-brand">
        <div class="login-brand-mark mark" data-ico="menu" aria-hidden="true">
        </div>

        <span>Digital Menu</span>
      </div>

      <div class="login-intro-copy">
        <h1 id="login-intro-title">
          Manage your menu from anywhere.
        </h1>

        <p>
          Add dishes, update prices and share one QR code with your guests.
        </p>
      </div>

      <p class="login-footnote">
        Restaurants are onboarded by our team. Your login is shared with you after onboarding.
      </p>

    </section>


    <!-- RIGHT LOGIN PANEL -->

    <section class="login-form-panel" aria-labelledby="login-title">

      <div class="login-form-box">

        <h2 id="login-title">Welcome back</h2>

        <p class="login-subtitle">
          Log in to your dashboard.
        </p>


        <form id="f">

          <!-- MOBILE / EMAIL -->

          <label for="identifier">
            Mobile number or email
          </label>

          <input id="identifier" name="identifier" type="text" required autocomplete="username" autofocus
            placeholder="9876543210 or you@restaurant.com">


          <!-- PASSWORD -->

          <label for="password">
            Password
          </label>

          <div class="password-field">

            <input id="password" name="password" type="password" required autocomplete="current-password">

            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password"
              aria-pressed="false" title="Show password">

              <!-- Eye icon -->

              <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>

            </button>

          </div>


          <!-- ERROR MESSAGE -->

          <div class="err login-error" id="err" role="alert">
          </div>


          <!-- LOGIN BUTTON -->

          <button class="lg login-submit" type="submit">
            Log in
          </button>

        </form>


        <p class="login-back">
          <a href="/">← Back to home</a>
        </p>

      </div>

    </section>

  </main>


  <script src="/app.js"></script>

  <script>

    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    const passwordInput = document.getElementById('password');

    const togglePassword = document.getElementById('togglePassword');

    const eyeIcon = document.getElementById('eyeIcon');


    togglePassword.addEventListener('click', () => {

      const showingPassword = passwordInput.type === 'password';

      passwordInput.type = showingPassword ? 'text' : 'password';

      togglePassword.setAttribute(
        'aria-label',
        showingPassword ? 'Hide password' : 'Show password'
      );

      togglePassword.setAttribute(
        'aria-pressed',
        String(showingPassword)
      );

      togglePassword.title = showingPassword
        ? 'Hide password'
        : 'Show password';


      // Change eye icon

      eyeIcon.innerHTML = showingPassword

        ? `
          <path d="M3 3l18 18"/>
          <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
          <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/>
          <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/>
        `

        : `
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        `;

    });


    // ==========================================
    // LOGIN FORM SUBMISSION
    // ==========================================

    $('#f').addEventListener('submit', async (e) => {

      e.preventDefault();

      $('#err').textContent = '';

      const submitButton = document.querySelector('.login-submit');

      submitButton.disabled = true;

      submitButton.textContent = 'Logging in...';

      try {

        const { role } = await api(
          '/api/v1/auth/session',
          'POST',
          Object.fromEntries(new FormData(e.target))
        );

        location.href = role === 'admin'
          ? '/admin'
          : '/dashboard';

      } catch (er) {

        $('#err').textContent = er.message;

        submitButton.disabled = false;

        submitButton.textContent = 'Log in';

      }

    });

  </script>

</body>

</html>
