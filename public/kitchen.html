<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen orders</title><link rel="stylesheet" href="/style.css"><style>body{background:#f5f8f4;color:#17291d}.k-wrap{max-width:1100px;margin:auto;padding:22px}.k-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.k-head h1{margin:0}.k-actions{display:flex;gap:8px}.k-btn{border:0;border-radius:9px;padding:10px 14px;background:#176b3a;color:#fff;font-weight:800;cursor:pointer}.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:22px}.k-card{background:#fff;border:1px solid #dfe8df;border-radius:14px;padding:16px;box-shadow:0 4px 14px #1231}.k-card h2{margin:0 0 4px}.k-meta{font-size:13px;color:#607064}.k-items{padding-left:20px}.k-status{border-radius:99px;padding:5px 9px;background:#edf6ee;color:#176b3a;font-size:12px;font-weight:800}.k-card select{padding:9px;border:1px solid #ccd9cd;border-radius:8px;max-width:100%}.k-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.k-error{color:#b42318}.k-empty{padding:50px;text-align:center;color:#647267}</style></head><body><main class="k-wrap"><header class="k-head"><div><h1>Kitchen orders</h1><p class="muted">New orders refresh automatically. Sign in as the restaurant owner first.</p></div><div class="k-actions"><a class="k-btn" href="/dashboard">Dashboard</a><button class="k-btn" id="refresh">Refresh</button></div></header><p id="msg" role="status"></p><section id="orders" class="k-grid"><p>Loading orders…</p></section></main><script>
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/v1/orders',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.href='/login';return;}const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load orders');$('#msg').textContent='';$('#orders').innerHTML=d.orders.length?d.orders.map(o=>`<article class="k-card"><div class="k-row"><h2>Order #${o.order_no}</h2><span class="k-status">${esc(o.status)}</span></div><p class="k-meta">${new Date(o.created_at).toLocaleString()} · ${esc(o.customer)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p>${o.note?`<p><b>Note:</b> ${esc(o.note)}</p>`:''}<ul class="k-items">${o.items.map(i=>`<li>${i.qty} × ${esc(i.name)} — ${money(i.line_total)}</li>`).join('')}</ul><div class="k-row"><b>Total ${money(o.total)}</b><select data-status="${o.id}"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option><option value="ready" ${o.status==='ready'?'selected':''}>Ready</option><option value="served" ${o.status==='served'?'selected':''}>Served</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></div></article>`).join(''):'<p class="k-empty">No orders yet. Customer orders will appear here.</p>';}catch(e){$('#msg').className='k-error';$('#msg').textContent=e.message;}}
$('#orders').addEventListener('change',async e=>{const s=e.target.closest('[data-status]');if(!s)return;try{const r=await fetch('/api/v1/orders/'+s.dataset.status+'/status',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not update');await load();}catch(err){$('#msg').className='k-error';$('#msg').textContent=err.message;}});$('#refresh').onclick=load;load();setInterval(load,10000);
</script></body></html>
